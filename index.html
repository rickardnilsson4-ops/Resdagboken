<body>
<div id="app">
  <div id="boot" class="center"><h1>Resdagboken</h1><p class="mute">Startar…</p></div>
</div>
<div id="ov" class="ov"><div id="box" class="box" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="app.js?v=16"></script>
<script>
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && b.isConnected && !window.__appStarted) b.innerHTML = '<h1>Resdagboken</h1><p>Appen kunde inte starta. Kontrollera att du har nät första gången du öppnar den och ladda om sidan.</p>';
  }, 12000);
</script>
